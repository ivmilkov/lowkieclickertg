<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>кликер закрыт</title>
<style>
  :root{
    --bg1:#071028;
    --bg2:#0b2540;
    --accent:#7b9cff;
    --glass: rgba(255,255,255,0.04);
    --card: rgba(255,255,255,0.02);
  }
  html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system,"Segoe UI",Roboto,Arial;}
  body{
    background: radial-gradient(1200px 600px at 10% 10%, rgba(123,156,255,0.06), transparent 8%),
                radial-gradient(1000px 500px at 90% 90%, rgba(0,210,255,0.03), transparent 8%),
                linear-gradient(180deg,var(--bg1),var(--bg2));
    color:#eaf0ff;
    display:flex;align-items:center;justify-content:center;
    padding:28px;
  }
  .wrap{
    width:100%;max-width:920px;border-radius:18px;padding:36px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    display:flex;gap:28px;align-items:center;
  }
  .left{
    width:160px;height:160px;border-radius:50%;
    background:conic-gradient(from 180deg at 50% 50%, rgba(123,156,255,0.12), rgba(0,210,255,0.08));
    display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;
    box-shadow: 0 8px 30px rgba(11,34,60,0.6);
    border:1px solid rgba(255,255,255,0.03);
  }
  .orb{
    width:126px;height:126px;border-radius:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    position:relative;overflow:hidden;
  }
  .emoji{
    font-size:46px;line-height:1;margin-bottom:6px;animation:float 3s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}
  .cannon-wrap{position:absolute;right:-28px;bottom:-22px;transform:scale(.88);opacity:.95;}
  .content{
    flex:1;padding:6px 2px 6px 6px;
  }
  h1{margin:0;font-size:30px;letter-spacing:0.2px;color:#ffffff;text-shadow:0 6px 30px rgba(10,30,60,0.6);line-height:1.08;}
  p.sub{margin:8px 0 0 0;color:rgba(234,240,255,0.8);opacity:.95;font-size:17px}
  .line{
    margin-top:18px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);
    border-radius:4px;opacity:.22;
  }
  .small{margin-top:14px;font-size:13px;color:rgba(234,240,255,0.6);display:flex;gap:10px;align-items:center}
  /* button styled in accent colors */
  .btn{
    margin-left:auto;background:linear-gradient(180deg,var(--accent),#5f7ef8);
    color:#06102d;border:none;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 30px rgba(92,109,255,0.18);text-decoration:none;display:inline-block;
  }
  .btn:active{transform:translateY(1px)}
  @media (max-width:560px){
    .wrap{flex-direction:column;align-items:center;text-align:center;padding:22px}
    .left{margin-bottom:8px}
    .btn{width:100%;margin-left:0;text-align:center}
  }
  .boom{display:inline-block;margin-left:6px;transform-origin:13px 8px;animation:recoil 1.6s ease-in-out infinite;}
  @keyframes recoil{0%{transform:rotate(-6deg)}40%{transform:rotate(0deg)}70%{transform:rotate(-2deg)}100%{transform:rotate(-6deg)}}
  .sparkles{position:absolute;left:10px;top:10px;opacity:.9}
  .sparkles span{position:absolute;width:6px;height:6px;border-radius:2px;background:linear-gradient(180deg,#fff,#bcd1ff);opacity:.95;transform:rotate(20deg);filter:blur(.2px);animation:tw 2.4s linear infinite}
  .sparkles span:nth-child(1){left:6px;top:18px;animation-delay:0s}
  .sparkles span:nth-child(2){left:38px;top:8px;animation-delay:.6s}
  .sparkles span:nth-child(3){left:96px;top:26px;animation-delay:1.1s}
  @keyframes tw{0%{opacity:0;transform:scale(.6)translateY(0)}50%{opacity:1;transform:scale(1.2)translateY(-6px)}100%{opacity:0;transform:scale(.6)translateY(-12px)}}
</style>
</head>
<body>
  <div class="wrap" role="dialog" aria-labelledby="title">
    <div class="left" aria-hidden="true">
      <div class="orb">
        <div class="emoji" title="страх">⚠️</div>
        <div style="font-size:12px;color:rgba(234,240,255,0.7)">экстренное<br>объявление</div>
        <div class="sparkles" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="cannon-wrap" aria-hidden="true">
        <svg width="160" height="80" viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g transform="translate(10,12)" class="boom">
            <rect x="0" y="34" width="52" height="14" rx="4" fill="#16243a"></rect>
            <rect x="44" y="18" width="68" height="12" rx="6" fill="#3a5578" transform="rotate(-10 78 24)"></rect>
            <circle cx="18" cy="52" r="8" fill="#1e2f45"></circle>
            <circle cx="46" cy="52" r="8" fill="#1e2f45"></circle>
            <circle cx="18" cy="52" r="5" fill="#7b9cff"></circle>
            <circle cx="46" cy="52" r="5" fill="#7b9cff"></circle>
            <g transform="translate(106,8)">
              <circle r="10" fill="#ffd3a6"></circle>
              <path d="M-2,-2 L6,2 L0,6 Z" fill="#ff8b4b" transform="rotate(18)"></path>
            </g>
          </g>
        </svg>
      </div>
    </div>

    <div class="content">
      <h1 id="title">кликер временно закрыт экстренно, решаем вопросы скоро откроем</h1>
      <p class="sub">приносим извинения за неудобства. мы работаем в приоритетном режиме, следите за обновлениями.</p>

      <div class="line" aria-hidden="true"></div>

      <div class="small" style="margin-top:16px;">
        <a href="https://t.me/lowkienews" class="btn" target="_blank" rel="noopener noreferrer">следить за новостями</a>
      </div>
    </div>
  </div>
</body>
</html>
